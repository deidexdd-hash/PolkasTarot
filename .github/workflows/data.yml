# Проверка данных колоды.
#
# Приложение читает js/data/*.js напрямую, без сборки, поэтому поломка
# в исходнике сразу видна в браузере: неэкранированная кавычка роняет
# разбор файла целиком, а хвостовой пробел в img даёт 404 на картинке.
# Оба случая уже случались и оба тихо переживали ручную проверку.
name: Данные

on:
  # Только push, без pull_request: так на каждый коммит приходится ровно
  # один прогон, и он же виден в PR — check runs привязываются к SHA.
  # Пара push + pull_request давала два одинаковых прогона на коммит,
  # а ограничение push веткой main оставляло ветки вообще без проверки,
  # пока для них не открыт PR.
  push:

jobs:
  check:
    name: Колода из 78 карт, картинки на месте
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Падает, если данные невалидны (не 78 карт, дубли id, пустой general,
      # нет файла картинки) ИЛИ если исходники в js/data/ требуют починки.
      # Второе важнее: конвертер чинит копию в памяти, а браузеру достаётся
      # файл как есть.
      - name: Проверить данные и исходники
        run: node tools/js2json.js --check

      # data/cards.json и data/index.json лежат в репозитории. Если их
      # правили руками или забыли пересобрать после правки js/data/,
      # выгрузка разойдётся с источником — здесь это видно.
      - name: Проверить, что data/*.json пересобираются без изменений
        run: |
          node tools/js2json.js
          git diff --exit-code -- data/cards.json data/index.json

      # Данные могут быть валидны, а приложение при этом сломано: колода
      # читается через fetch, разметка собирается в рантайме. Поэтому
      # страница поднимается в jsdom и проверяется то, что видит пользователь.
      # Второй прогон — с localStorage, который бросает на каждый вызов:
      # однажды это роняло загрузку колоды целиком.
      - name: Поставить jsdom
        run: npm --prefix tools install --no-audit --no-fund --omit=optional

      - name: Прогнать приложение в jsdom
        run: |
          node tools/test-journal.js
          node tools/test-images.js
          node tools/e2e.js
          node tools/e2e.js --broken-storage
