# Проверка данных колоды.
#
# Приложение читает js/data/*.js напрямую, без сборки, поэтому поломка
# в исходнике сразу видна в браузере: неэкранированная кавычка роняет
# разбор файла целиком, а хвостовой пробел в img даёт 404 на картинке.
# Оба случая уже случались и оба тихо переживали ручную проверку.
name: Данные

on:
  push:
  pull_request:

jobs:
  check:
    name: Колода из 78 карт, картинки на месте
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Падает, если данные невалидны (не 78 карт, дубли id, пустой general,
      # нет файла картинки) ИЛИ если исходники в js/data/ требуют починки.
      # Второе важнее: конвертер чинит копию в памяти, а браузеру достаётся
      # файл как есть.
      - name: Проверить данные и исходники
        run: node tools/js2json.js --check

      # data/cards.json и data/index.json лежат в репозитории. Если их
      # правили руками или забыли пересобрать после правки js/data/,
      # выгрузка разойдётся с источником — здесь это видно.
      - name: Проверить, что data/*.json пересобираются без изменений
        run: |
          node tools/js2json.js
          git diff --exit-code -- data/cards.json data/index.json
